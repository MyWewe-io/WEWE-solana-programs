# .github/workflows/anchor-test.yml
name: Anchor Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana/Anchor/Rust/Node/Yarn
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 0.31.0
          avm use 0.31.0

      # Keep the test runtime on the version used by the project. The Solana
      # installer follows the runner default, and Node 24 requires JSON import
      # attributes that this TypeScript/Mocha toolchain does not emit.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: yarn

      - name: Show versions
        run: |
          rustc --version
          solana --version
          anchor --version
          node -v
          yarn -v

      - name: Install Node deps
        run: yarn install --frozen-lockfile

      - name: Generate Solana keypair (CI wallet)
        run: |
          mkdir -p $HOME/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --force -o $HOME/.config/solana/id.json
          chmod 600 $HOME/.config/solana/id.json
          solana config set --keypair $HOME/.config/solana/id.json

      - name: Run Anchor tests
        # Runs against a local validator (Anchor.toml [test.validator]); the
        # fresh keypair is auto-funded by the local faucet. No secrets / devnet SOL.
        run: anchor test --provider.cluster localnet
